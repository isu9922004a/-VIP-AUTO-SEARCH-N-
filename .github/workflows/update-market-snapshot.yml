name: Update TWSE TPEx market snapshot

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These run at 18:20, 19:20, 20:20 Asia/Taipei on weekdays.
    - cron: '20 10,11,12 * * 1-5'
    # Morning safety run: 07:20 Asia/Taipei Monday-Friday.
    - cron: '20 23 * * 0-4'

permissions:
  contents: write

concurrency:
  group: update-market-snapshot
  cancel-in-progress: false

jobs:
  update-market-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch official TWSE and TPEx data
        run: node scripts/update-market-snapshot.mjs

      - name: Commit snapshot when changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/market/latest.json data/market/archive)" ]; then
            echo "No complete market snapshot change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/latest.json data/market/archive
          TRADE_DATE=$(node -e "const f=require('./data/market/latest.json');process.stdout.write(String(f.tradeDate||'unknown'))")
          git commit -m "data: update complete TWSE TPEx snapshot ${TRADE_DATE}"
          git push
